; This firmware compiles in every printer protocol (zpl, ql -- Brother QL
; raster) and every connection method (network, serial, usb_host) in a single
; binary. Which combination is active is chosen at runtime, on first boot,
; via the web UI's setup wizard (see src/web_ui.cpp's renderWizardPage()) --
; not at flash time. cfg.printerProtocol/cfg.printerMethod (src/config.h)
; are the runtime source of truth; src/targets/target.cpp dispatches to the
; selected method's *_target.cpp implementation, and src/mqtt_bridge.cpp
; branches on cfg.printerProtocol to validate incoming job payload types.
;
; A relay-over-the-board's-own-USB/programming-port method ("usb") used to
; exist (src/targets/usb_target.cpp) but was deliberately dropped: no board
; env ever used it, and it would have fought with this firmware's fixed
; choice of always running debug output over that same port (see
; ARDUINO_USB_CDC_ON_BOOT below and src/logging.cpp).
;
; A new transport method gets its own src/targets/*_target.cpp (implementing
; the contract in src/targets/target.h) plus a case in target.cpp's
; dispatcher; a new protocol gets a branch in mqtt_bridge.cpp's payload_type
; validation. Neither needs a new platformio.ini env -- there's only one,
; per board.

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; upload_speed = 115200

lib_deps =
  bertmelis/espMqttClient@^1.7.3
  bblanchon/ArduinoJson@^7.0.4
  adafruit/Adafruit NeoPixel@^1.12.3

build_flags =
  -D CORE_DEBUG_LEVEL=2
  -D DEFAULT_MQTT_HOST='"fb750433694544efa82d452638dea659.s1.eu.hivemq.cloud"'
  -D DEFAULT_MQTT_PORT=8883
  -D DEFAULT_MQTT_USE_TLS=true
  -D DEFAULT_MQTT_TLS_INSECURE=true
  -D DEFAULT_MQTT_USER='"stikka"'
  -D DEFAULT_MQTT_PASSWORD='"stikka123"'
  ; Unconditional (not per-env like it used to be): the usb_host method needs
  ; native-CDC auto-init off so usb_host_install() doesn't fight it for the
  ; native USB-OTG peripheral, and since method is now runtime-selected
  ; rather than fixed per build, this has to hold regardless of which method
  ; ends up chosen. As a result Serial always resolves to real UART0 (the
  ; board's separate programming-bridge port, physically independent from
  ; the native USB-OTG connector on this board) -- which is exactly the port
  ; src/logging.cpp uses for debug output, always, regardless of method.
  -D ARDUINO_USB_CDC_ON_BOOT=0


; ###########
; # Boards
; ###########

; ESP32-s3-DevKitC-1 (ESP32-S3)
; some AliExpress Version with an NEOPIXEL

[env:esp32-s3-devkitc-1]
extends = env
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${env.build_flags}
  ; PlatformIO's "esp32-s3-devkitc-1" board id is Espressif's base N8/no-PSRAM
  ; SKU -- board_build.arduino.memory_type alone only selects which sdkconfig
  ; variant gets compiled (PSRAM speed/pin/mode detail macros), it does NOT
  ; flip on PSRAM support itself. Arduino-ESP32's esp32-hal-psram.h
  ; unconditionally #undefs CONFIG_SPIRAM/CONFIG_SPIRAM_SUPPORT unless
  ; BOARD_HAS_PSRAM is separately defined (the way a genuinely PSRAM-labeled
  ; board's own board.json bakes it into extra_flags) -- without this,
  ; psramInit() is never even called and psramFound() always reports false,
  ; regardless of memory_type or real hardware.
  -D BOARD_HAS_PSRAM
  ; Status LED is compile-time-only (src/status_led.cpp) -- not NVS-backed or
  ; web-UI-editable, since only this one board/LED combination exists.
  -D DEFAULT_LED_MODE='"neopixel"'
  -D DEFAULT_LED_PIN=48
  -D DEFAULT_LED_ORDER='"GRB"'
  -D DEFAULT_LED_BLINK_MS=700

